# thomas-core → 腾讯云新机自动部署（GitHub Actions）
# 目标主机走 vars.DEPLOY106_HOST，仓内不出现裸 IP（纪律：IP 只活在 GitHub 变量里）
#
# 两条触发：
#   1) 本仓 main 上 backend / scripts / contracts / 本工作流有变更 → 测完部署新机
#   2) gfcc 打 v* tag（或手动填 gfcc_ref）→ 先把该提交的契约钉进本仓 main，再部署新机
#      天翼已退役。gfcc 的 Deploy 工作流只发 repository_dispatch，不登录旧机。
#   核部署成功后另起 gfcc-kernel：只听 127.0.0.1:5211，不切公网，不出境。
#   失败不回滚 thomas-core。凭据在服务器 ~/gfcc-kernel/.env，不进仓。
#
# 安全口径（FN-2026-11-07-01 退役对账教训，逐条内建）：
#   1) 钉 SSH 主机密钥指纹（DEPLOY106_HOST_FINGERPRINT），严禁 StrictHostKeyChecking=no
#      —— 退役 IP 会被云商回收转售，不钉指纹 = 把部署产物和私钥送给下一任住户
#      登录用运行器自带的 OpenSSH（scripts/ci-ssh.sh）。不再用 appleboy/ssh-action：
#      它每次先从 GitHub Releases 下载 drone-ssh，504 时任务还没连上服务器就失败。
#      已存的指纹是 ECDSA P-256（2026-11-07 按当时 Go 客户端的协商结果录入）。
#      脚本强制 HostKeyAlgorithms=ecdsa-sha2-nistp256，扫描结果对不上指纹就退出。
#   2) 专用部署密钥 DEPLOY106_SSH_KEY（交付包 ci-prep/ 生成，私钥只进 GitHub secret、永不入仓），
#      不复用 github/tencent 共用钥 id_ed25519；泄露只废这一把，轮换成本最小
#   3) 本工作流只指向新机；旧机（阿里云 / 天翼 / 腾讯云旧实例）的部署工作流不再使用
#   4) host 走 vars.DEPLOY106_HOST，工作流里不写死 IP——IP 变更改变量即可，
#      且变量为空时 CI 直接失败，不会误投
#
# 前置（缺一不可）：
#   - backend/requirements-core.pinned.txt 已提交进 thomas-core 仓（R3 定版）
#   - 服务器侧 ~/thomas/bin/deploy-thomas-core.sh 已就位（首次可随本文件一起 scp）
#   - GitHub 侧 secrets/variables 已建（见交付说明）
#   - gfcc 仓 Secret THOMAS_DISPATCH_TOKEN 能向本仓发 repository_dispatch
#   - 若 main 禁止 GITHUB_TOKEN 直推，在本仓配置 Secret GFCC_SYNC_TOKEN（允许推 main 的令牌）

name: deploy-106

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'contracts/**'
      - '.github/workflows/deploy-106.yml'
  workflow_dispatch:
    inputs:
      sha:
        description: '部署指定 commit（留空 = 同步后的 main 或当前提交）'
        required: false
      gfcc_ref:
        description: '先钉这个 gfcc tag 或 SHA，再部署。留空则只部署本仓'
        required: false
  repository_dispatch:
    types: [gfcc-tag]

concurrency:
  group: deploy-106
  cancel-in-progress: false   # 部署不并发，排队执行，避免 smoke/重启互相踩

jobs:
  sync-gfcc:
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.gfcc_ref != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GFCC_SYNC_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: GenzLTD/gfcc
          ref: ${{ github.event.client_payload.sha || github.event.inputs.gfcc_ref }}
          path: .gfcc-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装钉版依赖
        run: pip install -r backend/requirements-core.pinned.txt
      - name: 钉 gfcc 契约并校验
        id: pin
        run: |
          set -euo pipefail
          gfcc_sha=$(git -C .gfcc-src rev-parse HEAD)
          python3 scripts/sync_gfcc_pin.py \
            --src .gfcc-src/contracts \
            --dest contracts/gfcc \
            --commit "$gfcc_sha" \
            --pinned-at "$(date -u +%F)"
          cd backend && python -m pytest tests/test_gfcc_pin.py
          echo "gfcc_sha=$gfcc_sha" >> "$GITHUB_OUTPUT"
      - name: 把新钉子推进 main
        id: commit
        run: |
          set -euo pipefail
          git config user.name "deploy-106"
          git config user.email "deploy-106@users.noreply.github.com"
          short=$(echo "${{ steps.pin.outputs.gfcc_sha }}" | cut -c1-12)
          if [ -z "$(git status --porcelain -- contracts/gfcc)" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "gfcc $short 已是当前钉子"
            exit 0
          fi
          git add contracts/gfcc
          git commit -m "chore(contracts): 同步 gfcc ${short} 钉版" -m "[skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.gfcc_ref == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 基线 3.12（2026-11-07 从 3.10 升级：3.10 已 EOL；钉版四包曾卡 >=3.10 零余量；3.12.13/3.13.14 实测 smoke 9/9）
      - name: 安装钉版依赖
        run: pip install -r backend/requirements-core.pinned.txt
      - name: 钉版校验
        run: cd backend && python -m pytest tests
      - name: smoke 门禁（临时 SQLite / 不联网 / 零业务风险）
        run: cd backend && python ../scripts/smoke_core.py

  deploy:
    needs: [test, sync-gfcc]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.sync-gfcc.result == 'success' || needs.sync-gfcc.result == 'skipped') &&
      (needs.test.result == 'success' || needs.sync-gfcc.result == 'success')
    runs-on: ubuntu-latest
    environment: production-106   # 可选：Settings→Environments 里配 required reviewers 当人工闸
    steps:
      - uses: actions/checkout@v4
      - name: 触发服务器侧部署（服务器经只读 deploy key 拉码，CI 不传制品）
        env:
          DEPLOY106_HOST: ${{ vars.DEPLOY106_HOST }}
          DEPLOY106_USER: ${{ vars.DEPLOY106_USER }}
          DEPLOY106_SSH_KEY: ${{ secrets.DEPLOY106_SSH_KEY }}
          DEPLOY106_HOST_FINGERPRINT: ${{ secrets.DEPLOY106_HOST_FINGERPRINT }}
        run: ./scripts/ci-ssh.sh deploy "${{ needs.sync-gfcc.outputs.sha || github.event.inputs.sha || github.sha }}"

  # 核部署成功之后才装 gfcc-kernel。失败不回滚 thomas-core。
  # 只听 127.0.0.1:5211，不改 nginx，不出境。钉子用刚部署的 SOURCE.json。
  kernel:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    environment: production-106
    steps:
      - uses: actions/checkout@v4
      - name: 本机回环安装 gfcc-kernel
        env:
          DEPLOY106_HOST: ${{ vars.DEPLOY106_HOST }}
          DEPLOY106_USER: ${{ vars.DEPLOY106_USER }}
          DEPLOY106_SSH_KEY: ${{ secrets.DEPLOY106_SSH_KEY }}
          DEPLOY106_HOST_FINGERPRINT: ${{ secrets.DEPLOY106_HOST_FINGERPRINT }}
        run: ./scripts/ci-ssh.sh kernel
